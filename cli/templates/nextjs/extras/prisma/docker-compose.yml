services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-start-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_start
    # Host port 5449 → container 5432. Chosen to avoid clashing with a
    # system Postgres on the default 5432. Override here if you need a
    # different host port and update DATABASE_URL in .env.development.local.
    ports:
      - "5449:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_start"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: dev-start-pgdata
